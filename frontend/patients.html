<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Patients | NalamCare</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="responsive.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body>

<main class="patients-page">

    <section class="patients-header">
        <div>
            <span class="dashboard-tag">PATIENT MANAGEMENT</span>
            <h1>Manage Patients</h1>
            <p>View and manage registered NalamCare patients.</p>
        </div>

        <a href="admin-dashboard.html" class="back-dashboard-btn">
            <i class="bi bi-arrow-left"></i>
            Back to Dashboard
        </a>
    </section>

    <section class="patients-stats">

        <div class="patient-stat-card">
            <div class="stat-icon">
                <i class="bi bi-people"></i>
            </div>
            <div>
                <span>Total Patients</span>
                <h2 id="patientCount">0</h2>
            </div>
        </div>

        <div class="patient-stat-card">
            <div class="stat-icon">
                <i class="bi bi-person-check"></i>
            </div>
            <div>
                <span>Registered Patients</span>
                <h2 id="registeredCount">0</h2>
            </div>
        </div>

    </section>

    <section class="patients-content">

        <div class="patients-card">

            <div class="patients-card-header">
                <div>
                    <span class="card-label">PATIENTS</span>
                    <h2>Registered Patients</h2>
                </div>

                <div class="patient-search">
                    <i class="bi bi-search"></i>
                    <input
                        type="text"
                        id="patientSearch"
                        placeholder="Search patients..."
                    >
                </div>
            </div>

            <div class="patients-table">

                <div class="patients-table-head">
                    <span>Patient</span>
                    <span>Email</span>
                    <span>Phone</span>
                    <span>Gender</span>
                    <span>Action</span>
                </div>

                <div class="patients-table-body" id="patientsList">
                    <p>Loading patients...</p>
                </div>

            </div>

        </div>

    </section>

</main>

<script>
document.addEventListener("DOMContentLoaded", async () => {

    const role = localStorage.getItem("role");

    if (role !== "admin") {
        window.location.href = "login.html";
        return;
    }

    try {

        const response = await fetch("/api/patients");
        const patients = await response.json();

        document.getElementById("patientCount").textContent = patients.length;
        document.getElementById("registeredCount").textContent = patients.length;

        const patientsList = document.getElementById("patientsList");

        patientsList.innerHTML = "";

        patients.forEach(patient => {

            const fullName =
                `${patient.first_name || ""} ${patient.last_name || ""}`.trim();

            const initials = fullName
                .split(" ")
                .filter(Boolean)
                .map(word => word[0])
                .slice(0, 2)
                .join("")
                .toUpperCase();

            const row = document.createElement("div");
            row.className = "patients-table-row";
row.innerHTML = `
    <div class="patient-info">
        <div class="patient-avatar">${initials}</div>
        <div>
            <h3>${fullName}</h3>
            <p>Patient</p>
        </div>
    </div>

    <span>${patient.email || "-"}</span>

    <span>${patient.phone || "-"}</span>

    <span>${patient.gender || "-"}</span>

    <button class="view-patient-btn" type="button"
        onclick="viewPatient(${patient.id})">
        <i class="bi bi-eye"></i>
    </button>
`;

            patientsList.appendChild(row);
        });

        if (patients.length === 0) {
            patientsList.innerHTML = "<p>No patients registered yet.</p>";
        }

        const searchInput = document.getElementById("patientSearch");

        searchInput.addEventListener("input", () => {

            const searchValue = searchInput.value.toLowerCase();

            document.querySelectorAll(".patients-table-row").forEach(row => {
                row.style.display =
                    row.textContent.toLowerCase().includes(searchValue)
                        ? "grid"
                        : "none";
            });

        });

    } catch (error) {

        console.error("Patient loading error:", error);

        document.getElementById("patientsList").innerHTML =
            "<p>Failed to load patients.</p>";
    }

});
</script>
<script>
    function viewPatient(patientId) {

    fetch("/api/patients")
        .then(response => response.json())
        .then(patients => {

            const patient = patients.find(
                item => Number(item.id) === Number(patientId)
            );

            if (!patient) {
                alert("Patient details not found!");
                return;
            }

            const fullName =
                `${patient.first_name || ""} ${patient.last_name || ""}`.trim();

            alert(
                `Patient Details\n\n` +
                `Name: ${fullName}\n` +
                `Email: ${patient.email || "-"}\n` +
                `Phone: ${patient.phone || "-"}\n` +
                `Date of Birth: ${patient.dob || "-"}\n` +
                `Gender: ${patient.gender || "-"}`
            );
        })
        .catch(error => {
            console.error("Patient details error:", error);
            alert("Failed to load patient details!");
        });
}
</script>


</body>
</html>
