<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointments | NalamClinic</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="responsive.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body>

<main class="appointments-page">

    <section class="appointments-header">
        <div>
            <span class="dashboard-tag">APPOINTMENT MANAGEMENT</span>
            <h1>Appointments</h1>
            <p>View and manage all NalamClinic appointments.</p>
        </div>

        <a href="admin-dashboard.html" class="back-dashboard-btn">
            <i class="bi bi-arrow-left"></i>
            Back to Dashboard
        </a>
    </section>

    <section class="appointment-stats">

        <div class="appointment-stat-card">
            <div class="stat-icon">
                <i class="bi bi-calendar2-check"></i>
            </div>
            <div>
                <span>Total Appointments</span>
                <h2 id="totalAppointmentCount">0</h2>
            </div>
        </div>

        <div class="appointment-stat-card">
            <div class="stat-icon">
                <i class="bi bi-hourglass-split"></i>
            </div>
            <div>
                <span>Pending</span>
                <h2 id="pendingAppointmentCount">0</h2>
            </div>
        </div>

        <div class="appointment-stat-card">
            <div class="stat-icon">
                <i class="bi bi-check-circle"></i>
            </div>
            <div>
                <span>Confirmed</span>
                <h2 id="confirmedAppointmentCount">0</h2>
            </div>
        </div>

    </section>

    <section class="appointments-content">

        <div class="appointments-card">

            <div class="appointments-card-header">
                <div>
                    <span class="card-label">APPOINTMENTS</span>
                    <h2>All Appointments</h2>
                </div>

                <div class="appointment-search">
                    <i class="bi bi-search"></i>
                    <input
                        type="text"
                        id="appointmentSearch"
                        placeholder="Search appointments..."
                    >
                </div>
            </div>

            <div class="appointments-table">

                <div class="appointments-table-head">
                    <span>Patient</span>
                    <span>Doctor</span>
                    <span>Date & Time</span>
                    <span>Status</span>
                    <span>Action</span>
                </div>

                <div class="appointments-table-body" id="appointmentsList">
                    <p>Loading appointments...</p>
                </div>

            </div>

        </div>

    </section>

</main>

<script>
document.addEventListener("DOMContentLoaded", async () => {

    const role = localStorage.getItem("role");

    if (role !== "admin") {
        window.location.href = "login.html";
        return;
    }

    try {

        const response = await fetch("/api/appointments");
        const appointments = await response.json();

        document.getElementById("totalAppointmentCount").textContent =
            appointments.length;

        document.getElementById("pendingAppointmentCount").textContent =
            appointments.filter(
                appointment => appointment.status === "pending"
            ).length;

        document.getElementById("confirmedAppointmentCount").textContent =
            appointments.filter(
                appointment => appointment.status === "confirmed"
            ).length;

        const appointmentsList =
            document.getElementById("appointmentsList");

        appointmentsList.innerHTML = "";

        appointments.forEach(appointment => {

            const patientName =
                appointment.patient_name || "Unknown Patient";

            const doctorName =
                appointment.doctor_name || "Unknown Doctor";

            const initials = patientName
                .split(" ")
                .filter(Boolean)
                .map(word => word[0])
                .slice(0, 2)
                .join("")
                .toUpperCase();

            const row = document.createElement("div");
            row.className = "appointments-table-row";

            row.innerHTML = `
                <div class="appointment-patient">
                    <div class="patient-avatar">${initials}</div>
                    <div>
                        <h3>${patientName}</h3>
                        <p>Patient</p>
                    </div>
                </div>

                <div class="appointment-doctor">
                    <h3>${doctorName}</h3>
                    <p>${appointment.department || "-"}</p>
                </div>

                <div class="appointment-date">
                    <strong>${appointment.appointment_date}</strong>
                    <span>${appointment.appointment_time}</span>
                </div>

                <span class="appointment-status ${appointment.status}">
                    ${appointment.status}
                </span>

                <div class="appointment-actions">
    <button
        class="view-appointment-btn"
        type="button"
        onclick="viewAppointment(${appointment.id})">
        <i class="bi bi-eye"></i>
    </button>

    <button
        class="confirm-appointment-btn"
        type="button"
        onclick="updateAppointmentStatus(${appointment.id}, 'confirmed')">
        <i class="bi bi-check-lg"></i>
    </button>

    <button
        class="cancel-appointment-btn"
        type="button"
        onclick="updateAppointmentStatus(${appointment.id}, 'cancelled')">
        <i class="bi bi-x-lg"></i>
    </button>
</div>
            `;

            appointmentsList.appendChild(row);
        });

        if (appointments.length === 0) {
            appointmentsList.innerHTML =
                "<p>No appointments available.</p>";
        }

        const searchInput =
            document.getElementById("appointmentSearch");

        searchInput.addEventListener("input", () => {

            const searchValue =
                searchInput.value.toLowerCase();

            document
                .querySelectorAll(".appointments-table-row")
                .forEach(row => {

                    row.style.display =
                        row.textContent
                            .toLowerCase()
                            .includes(searchValue)
                            ? "grid"
                            : "none";
                });
        });

    } catch (error) {

        console.error("Appointment loading error:", error);

        document.getElementById("appointmentsList").innerHTML =
            "<p>Failed to load appointments.</p>";
    }

});

function viewAppointment(appointmentId) {

    fetch("/api/appointments")
        .then(response => response.json())
        .then(appointments => {

            const appointment = appointments.find(
                item => Number(item.id) === Number(appointmentId)
            );

            if (!appointment) {
                alert("Appointment details not found!");
                return;
            }

            alert(
                `Appointment Details\n\n` +
                `Patient: ${appointment.patient_name || "-"}\n` +
                `Doctor: ${appointment.doctor_name || "-"}\n` +
                `Department: ${appointment.department || "-"}\n` +
                `Date: ${appointment.appointment_date || "-"}\n` +
                `Time: ${appointment.appointment_time || "-"}\n` +
                `Reason: ${appointment.reason || "-"}\n` +
                `Status: ${appointment.status || "-"}`
            );
        })
        .catch(error => {
            console.error("Appointment details error:", error);
            alert("Failed to load appointment details!");
        });
        
}
function updateAppointmentStatus(appointmentId, status) {

    const actionText =
        status === "confirmed" ? "confirm" : "cancel";

    const confirmAction = confirm(
        `Are you sure you want to ${actionText} this appointment?`
    );

    if (!confirmAction) return;

    fetch(`/api/appointments/${appointmentId}/status`, {
        method: "PATCH",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            status: status
        })
    })
    .then(response => response.json())
    .then(data => {

        if (data.message === "Appointment status updated successfully!") {
            alert(`Appointment ${status} successfully!`);
            location.reload();
        } else {
            alert(data.message || "Failed to update appointment!");
        }

    })
    .catch(error => {
        console.error("Appointment status error:", error);
        alert("Server connection failed!");
    });
}
</script>

</body>
</html>
